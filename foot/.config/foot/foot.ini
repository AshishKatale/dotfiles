# vim: ft=dosini

font=BlexMonoNerdFont:size=9.5:style=Regular
font-bold=BlexMonoNerdFont:size=9.5:style=Bold
font-italic=BlexMonoNerdFont:size=9.5:style=Italic
font-bold-italic=BlexMonoNerdFont:size=9.5:style=BoldItalic

[environment]
# name=value

[security]
# osc52=enabled  # disabled|copy-enabled|paste-enabled|enabled


[scrollback]
lines=2000
# multiplier=3.0
# indicator-position=relative
# indicator-format=""

[mouse]
# hide-when-typing=no
# alternate-scroll-mode=yes

[touch]
# long-press-delay=400

[cursor]
# style=block
# blink=no
# blink-rate=500
# beam-thickness=1.5
underline-thickness=1.5

[colors-dark]
alpha=0.75
# alpha-mode=default # Can be `default`, `matching` or `all`

cursor=4D4D4C F5E0DC

background=11111B
foreground=DBDBDB

selection-background=264F78
# selection-foreground=

# flash=7f7f00
# flash-alpha=0.5

## dimmed colors (see foot.ini(5) man page)
dim0=1E1E1E  # black
dim1=FF6E6E  # red
dim2=40CC80  # green
dim3=AAAA40  # yellow
dim4=3BA1DD  # blue
dim5=CC1AAC  # magenta
dim6=00ABAB  # cyan
dim7=BABABA  # white

## Normal/regular colors (color palette 0-7)
regular0=2C2C2C  # black
regular1=FF4E4E  # red
regular2=40EE80  # green
regular3=CCCC40  # yellow
regular4=00A1FF  # blue
regular5=EC4DEC  # magenta
regular6=00CCCC  # cyan
regular7=DEDEDE  # white

## Bright colors (color palette 8-15)
bright0=3C4048   # bright black
bright1=FF1E1E   # bright red
bright2=20FF20   # bright green
bright3=FFFF40   # bright yellow
bright4=2EA1FF   # bright blue
bright5=FF1FFF   # bright magenta
bright6=00FFFF   # bright cyan
bright7=FFFFFF   # bright white

## Misc colors
scrollback-indicator=393939 777777
jump-labels=DEDEDE 0A7ACA
search-box-no-match=DEDEDE CA6702
search-box-match=DEDEDE 0A7ACA

# [tweak]
# render-timer=osd

[key-bindings]
prompt-next                = Control+Shift+bracketright
prompt-prev                = Control+Shift+bracketleft

scrollback-up-line         = Control+Shift+k
scrollback-down-line       = Control+Shift+j
scrollback-up-half-page    = Control+Shift+u
scrollback-down-half-page  = Control+Shift+d

font-reset                 = Control+Shift+0
font-increase              = Control+Shift+plus
font-decrease              = Control+Shift+underscore

unicode-input              = Control+Shift+i
search-start               = Control+Shift+f

[search-bindings]
find-prev     = Control+p
find-next     = Control+n

